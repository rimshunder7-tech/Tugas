<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/logo-bulan.svg" type="image/svg+xml">
  <title>Edit Produk | Admin Bulan Bakery</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../rez.js" defer></script>
  <style type="text/tailwindcss">
    @layer components {
      .sidelink { @apply flex items-center rounded-lg px-3 py-2 text-sm font-medium transition hover:bg-amber-100 [&[aria-current]]:bg-amber-700 [&[aria-current]]:text-white dark:hover:bg-stone-700 dark:[&[aria-current]]:bg-amber-500 dark:[&[aria-current]]:text-stone-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700 dark:focus-visible:outline-amber-300; }
      .btn { @apply inline-block rounded-lg bg-amber-700 px-5 py-2.5 font-semibold text-white shadow transition hover:bg-amber-800 active:translate-y-px dark:bg-amber-500 dark:text-stone-900 dark:hover:bg-amber-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700 dark:focus-visible:outline-amber-300; }
      .btn2 { @apply inline-block rounded-lg border border-stone-500 px-5 py-2.5 font-semibold transition hover:bg-amber-100 dark:border-stone-400 dark:hover:bg-stone-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700 dark:focus-visible:outline-amber-300; }
      .kartu { @apply rounded-2xl bg-white shadow-md ring-1 ring-amber-200 dark:bg-stone-800 dark:ring-stone-700; }
      .field { @apply w-full rounded-lg border border-stone-500 bg-white px-3 py-2 shadow-sm transition focus:border-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-600 [&:user-invalid]:border-red-700 dark:border-stone-400 dark:bg-stone-800; }
      .aksi { @apply inline-block rounded-md border px-2.5 py-1 text-xs font-medium transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700 dark:focus-visible:outline-amber-300; }
      .badge-aktif { @apply inline-block rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-semibold text-green-900 dark:bg-green-900 dark:text-green-100; }
      .badge-menipis { @apply inline-block rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-900 dark:bg-amber-900 dark:text-amber-100; }
      .badge-habis { @apply inline-block rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-semibold text-red-900 dark:bg-red-900 dark:text-red-100; }
    }
  </style>
</head>
<body class="bg-amber-50 font-sans text-stone-900 antialiased transition-colors duration-300 dark:bg-stone-900 dark:text-stone-100">
  <a href="#konten-utama" class="skip-link sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-amber-700 focus:px-4 focus:py-2 focus:text-white">Lompat ke konten utama</a>
  <div class="md:flex md:min-h-screen">
    <aside class="border-b border-amber-200 bg-white p-4 dark:border-stone-700 dark:bg-stone-800 md:sticky md:top-0 md:h-screen md:w-64 md:shrink-0 md:border-b-0 md:border-r">
      <p class="mb-4 text-xl font-bold">Bulan Bakery <span class="block text-xs font-medium text-stone-700 dark:text-stone-300">Panel Admin</span></p>
      <nav aria-label="Menu admin">
        <ul class="flex flex-wrap gap-1 md:flex-col">
        <li><a class="sidelink" href="dashboard.html">Dashboard</a></li>
        <li><a class="sidelink" href="produk.html" aria-current="true">Produk</a></li>
        <li><a class="sidelink" href="tambah-produk.html">Tambah Produk</a></li>
        </ul>
      </nav>
      <div class="mt-4 flex flex-wrap items-center gap-3 border-t border-amber-200 pt-4 text-sm dark:border-stone-700">
        <a class="underline" href="../index.html">Lihat situs</a>
        <a class="underline" href="login.html">Keluar</a>
        <button id="tema" type="button" aria-pressed="false" class="rounded-lg border border-stone-500 px-3 py-2 text-xs transition hover:bg-amber-100 dark:border-stone-400 dark:hover:bg-stone-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700 dark:focus-visible:outline-amber-300">Mode gelap</button>
      </div>
    </aside>
    <main id="konten-utama" class="min-w-0 flex-1 px-4 py-8 md:px-8">
      <h1 class="text-3xl font-bold tracking-tight">Edit Produk</h1>
      <p class="mt-1 text-stone-700 dark:text-stone-300">Ubah data produk, lalu simpan perubahan.</p>
      <form action="produk.html" method="get" class="kartu mt-6 max-w-2xl p-6">
        <fieldset class="grid gap-3">
          <legend class="mb-3 text-lg font-semibold">Data produk</legend>
          <label for="nama" class="text-sm font-medium">Nama produk</label>
          <input class="field" type="text" id="nama" name="nama" required title="Nama produk wajib diisi">
          <label for="kategori" class="text-sm font-medium">Kategori</label>
          <select class="field" id="kategori" name="kategori" required><option value="Roti manis">Roti manis</option><option value="Pastry">Pastry</option></select>
          <label for="harga" class="text-sm font-medium">Harga (Rp)</label>
          <input class="field" type="number" id="harga" name="harga" min="0" step="500" required title="Isi harga dalam rupiah">
          <label for="status" class="text-sm font-medium">Status</label>
          <select class="field" id="status" name="status" required><option value="aktif">Aktif</option><option value="menipis">Stok Menipis</option><option value="habis">Habis</option></select>
          <label for="deskripsi" class="text-sm font-medium">Deskripsi</label>
          <textarea class="field" id="deskripsi" name="deskripsi" rows="3" required title="Deskripsi wajib diisi"></textarea>
          <label for="foto" class="text-sm font-medium">Foto produk</label>
          <input class="field file:mr-3 file:rounded-md file:border-0 file:bg-amber-100 file:px-3 file:py-1 file:text-amber-900" type="file" id="foto" name="foto" accept="image/*">
        </fieldset>
        <p class="mt-6 flex flex-wrap gap-3"><button class="btn" type="submit">Simpan perubahan</button><a class="btn2" href="produk.html">Batal</a></p>
      </form>
      <script>
        const D={1: {"nama": "Coffee Buns", "kategori": "Roti manis", "harga": 15000, "status": "aktif", "deskripsi": "Roti manis bertekstur kontras, memadukan kelembutan roti di dalam dengan kerenyahan lapisan kopi di luar."}, 2: {"nama": "Kornet Coklat", "kategori": "Roti manis", "harga": 22000, "status": "aktif", "deskripsi": "Roti manis bergaya Jepang berbentuk tanduk dengan isian krim atau selai cokelat."}, 3: {"nama": "Croissant", "kategori": "Pastry", "harga": 20000, "status": "menipis", "deskripsi": "Kue kering berlapis asal Prancis dengan bentuk bulan sabit."}, 4: {"nama": "Cromboloni", "kategori": "Pastry", "harga": 32000, "status": "aktif", "deskripsi": "Pastry bulat berlapis ala croissant dengan isian krim lumer."}, 5: {"nama": "Pretzel", "kategori": "Pastry", "harga": 24000, "status": "habis", "deskripsi": "Kue panggang khas Eropa dengan bentuk simpul tali."}};
        var id = new URLSearchParams(location.search).get('id'), p = D[id] || D[1];
        Object.keys(p).forEach(function (k) { document.getElementById(k).value = p[k]; });
      </script>
    </main>
  </div>
</body>
</html>
